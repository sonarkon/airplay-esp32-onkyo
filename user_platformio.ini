; Zwei Umgebungen: der vollständige Aufbau (onkyo) und ein schlanker
; Testbuild, der nur S/PDIF enthält (onkyo-spdif-only) — zum isolierten
; Prüfen, bevor Fernsteuerung, OLED und Automatik dazukommen.
;
;   pio run -e onkyo-spdif-only -t upload
;   pio run -e onkyo-spdif-only -t uploadfs   ; einmalig
;
;   pio run -e onkyo -t upload                ; der vollständige Aufbau
;   pio run -e onkyo -t uploadfs               ; einmalig

[env:onkyo-spdif-only]
extends = env:esp32s3
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.user.onkyo-spdif-only"

[env:onkyo]
extends = env:esp32s3
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.user.onkyo"

; Diagnose-Build: wie onkyo, aber ohne Display — testet, ob die 500ms-I2C-
; Aktualisierung des OLED der Grund fuer den RMT-Timeout bei remote_control_send() ist.
[env:onkyo-no-display]
extends = env:esp32s3
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="config/sdkconfig.defaults;config/sdkconfig.defaults.esp32s3;config/sdkconfig.user.onkyo-no-display"
